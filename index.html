<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Levantamiento de Información</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1b2333;--mut:#667085;--line:#dde3ee;--pri:#1F3864;--pri-ink:#fff;--acc:#E36C0A;--ok:#198754;--warn:#b7791f;--bad:#c0392b;--fld:#fbfcfe;--soft:#eef2f9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141c;--card:#1a202c;--ink:#e8ecf4;--mut:#9aa6bb;--line:#2c3547;--pri:#7fa6ee;--pri-ink:#0d1626;--acc:#f08a35;--ok:#4cc38a;--warn:#e0b04a;--bad:#ef7a6c;--fld:#141a25;--soft:#222b3b}}
:root[data-theme="dark"]{--bg:#10141c;--card:#1a202c;--ink:#e8ecf4;--mut:#9aa6bb;--line:#2c3547;--pri:#7fa6ee;--pri-ink:#0d1626;--acc:#f08a35;--ok:#4cc38a;--warn:#e0b04a;--bad:#ef7a6c;--fld:#141a25;--soft:#222b3b}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 130px)}* {box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.05)}.wrap{max-width:900px;margin:0 auto;padding:0 14px}.hrow{display:flex;align-items:center;gap:10px;padding:10px 0 6px;flex-wrap:wrap}.hrow h1{font-size:17px;margin:0;flex:1;min-width:180px;color:var(--pri)}.hrow small{display:block;color:var(--mut);font-weight:400;font-size:12px}.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}.seg button{border:0;background:transparent;color:var(--mut);padding:6px 11px;font:inherit;font-size:12px;cursor:pointer}.seg button.on{background:var(--pri);color:var(--pri-ink)}.pbar{height:6px;background:var(--soft);border-radius:9px;overflow:hidden}.pbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--acc));width:0;transition:width .3s}.pinfo{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);padding:4px 0}nav.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:thin}.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--fld);color:var(--ink);border-radius:999px;padding:6px 11px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}.chip.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}.chip b{font-weight:600;font-size:11px;opacity:.75;margin-left:4px}main{max-width:900px;margin:0 auto;padding:14px 14px 110px}.sec-h{display:flex;gap:12px;align-items:flex-start;margin:6px 0 12px}.sec-h .ic{font-size:28px}.sec-h h2{margin:0;font-size:21px;color:var(--pri)}.sec-h p{margin:2px 0 0;color:var(--mut)}.banner{background:var(--soft);border-left:4px solid var(--acc);padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:14px}.field{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}.field.pend{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 7%,var(--card))}.fh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.lbl{font-weight:600;font-size:14px}.star{color:var(--acc)}.hint{font-size:12px;color:var(--mut);margin:2px 0 6px}.pb{flex:0 0 auto;border:1px dashed var(--line);background:transparent;color:var(--mut);border-radius:999px;font:inherit;font-size:11px;padding:3px 8px;cursor:pointer}.pb.on{border:1px solid var(--warn);color:var(--warn);font-weight:600}input[type=text],input[type=email],input[type=tel],input[type=url],input[type=number],input[type=date],input[type=time],input[type=password],select,textarea{width:100%;border:1px solid var(--line);background:var(--fld);color:var(--ink);border-radius:9px;padding:9px 10px;font:inherit;margin-top:5px}textarea{min-height:76px;resize:vertical}input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:0;border-color:transparent}.opts{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}.opt{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--fld);padding:7px 11px;border-radius:999px;cursor:pointer;font-size:14px}.opt:has(input:checked){border-color:var(--pri);background:var(--soft);font-weight:600}.opt input{accent-color:var(--pri);margin:0}.color{display:flex;gap:8px;align-items:center}.color input[type=color]{width:46px;height:40px;border:1px solid var(--line);border-radius:8px;padding:2px;margin-top:5px;background:var(--fld)}.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--pri);background:var(--pri);color:var(--pri-ink);border-radius:9px;padding:8px 13px;font:inherit;font-size:14px;cursor:pointer}.btn.ghost{background:transparent;color:var(--pri)}.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}.btn.sm{padding:5px 9px;font-size:12px}.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}.files{margin-top:6px}.fbar{display:flex;flex-wrap:wrap;gap:7px}.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}.th{position:relative;width:92px}.th .im{width:92px;height:72px;border-radius:8px;border:1px solid var(--line);background:var(--soft);display:flex;align-items:center;justify-content:center;overflow:hidden;font-weight:700;color:var(--mut);font-size:13px}.th img{width:100%;height:100%;object-fit:contain}.th span{display:block;font-size:10.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}.th button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--bad);color:#fff;cursor:pointer;font-size:12px;line-height:1}.rep details{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}.rep summary{display:flex;align-items:center;gap:9px;padding:10px 12px;cursor:pointer;background:var(--soft);list-style:none}.rep summary::-webkit-details-marker{display:none}.rn{background:var(--pri);color:var(--pri-ink);border-radius:50%;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:0 0 auto}.rt{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ra{display:flex;gap:5px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 12px;padding:6px 12px 12px}.grid .full{grid-column:1/-1}.grid label.cl{font-size:12.5px;font-weight:600;display:block;margin-top:6px}.chk{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px}.chk input{accent-color:var(--pri);width:18px;height:18px}.repbar{display:flex;gap:8px;flex-wrap:wrap}.note{background:var(--soft);padding:9px 12px;border-radius:8px;color:var(--mut);font-size:13px;margin:0 0 12px}.internal{border:2px dashed var(--acc);border-radius:12px;padding:12px;background:color-mix(in srgb,var(--acc) 6%,var(--card));margin-top:18px}.foot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:15;padding-bottom:env(safe-area-inset-bottom,0px)}.foot .wrap{display:flex;gap:10px;justify-content:space-between;align-items:center;padding-top:9px;padding-bottom:9px}.foot .sv{font-size:11.5px;color:var(--mut);text-align:center;flex:1}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}.card h3{margin:0 0 8px;font-size:16px;color:var(--pri)}.srow{display:flex;align-items:center;gap:10px;margin:7px 0;cursor:pointer}.srow .n{flex:0 0 150px;font-size:13px}.srow .pbar{flex:1}.srow .p{width:42px;text-align:right;font-size:12px;color:var(--mut)}.mlist{margin:0;padding-left:0;list-style:none;font-size:13.5px}.mlist li{padding:5px 0;border-bottom:1px solid var(--line);cursor:pointer}.mlist li:last-child{border:0}.mlist em{color:var(--mut);font-style:normal;font-size:12px}.tag{display:inline-block;font-size:10.5px;border-radius:999px;padding:1px 7px;margin-left:5px;border:1px solid var(--line)}.tag.k{color:var(--acc);border-color:var(--acc)}.tag.p{color:var(--warn);border-color:var(--warn)}.btns{display:flex;flex-wrap:wrap;gap:8px}#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:#111c;color:#fff;backdrop-filter:blur(6px);padding:9px 16px;border-radius:999px;font-size:13px;z-index:50;opacity:0;pointer-events:none;transition:opacity .25s;max-width:92vw;text-align:center}#toast.on{opacity:1}@media(max-width:600px){.grid{grid-template-columns:1fr}.srow .n{flex-basis:105px}.hrow h1{font-size:15px}.auth{max-width:440px;margin:40px auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.topbar h1{margin:0;font-size:22px;color:var(--pri)}.auth input,.card input[type=text],.card input[type=email]{margin-top:4px}}
</style>
</head>
<body>
<header id="hdr" style="display:none">
  <div class="wrap">
    <div class="hrow">
      <button class="btn ghost sm" id="backBtn" data-act="home">← Proyectos</button>
      <h1 id="ttl">Levantamiento de información<small id="sub"></small></h1>
      <div class="seg" id="modeSeg">
        <button data-act="mode" data-m="presencial">📍 Presencial</button>
        <button data-act="mode" data-m="cliente">👤 Cliente</button>
      </div>
    </div>
    <div class="pbar"><i id="bar"></i></div>
    <div class="pinfo"><span id="pct">0%</span><span id="pinfo2"></span></div>
    <nav class="chips" id="chips"></nav>
  </div>
</header>
<main id="main"><p style="text-align:center;margin-top:60px;color:var(--mut)">Cargando…</p></main>
<div class="foot" id="foot" style="display:none"><div class="wrap">
  <button class="btn ghost" data-act="prev">← Anterior</button>
  <div class="sv" id="sv">Cargando…</div>
  <button class="btn" data-act="next">Siguiente →</button>
</div></div>
<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
